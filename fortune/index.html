<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta property="og:title" content="今日星座運勢 ✨">
  <meta property="og:description" content="輸入你的名字和星座，看看今天的好運能量！">
  <meta property="og:image" content="https://aiwellnesstw.github.io/fortune/og.png?v=2">
  <meta property="og:url" content="https://aiwellnesstw.github.io/fortune/">
  <title>今日星座運勢 ✨</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── 畫面一：輸入 ── -->
  <div id="screen-input" class="screen active">
    <div class="header">
      <div class="header-brand">✨ 今日星座運勢</div>
      <div id="date-display" class="date-display"></div>
      <div id="weather-display" class="weather-display hidden"></div>
    </div>

    <div id="referral-banner" class="referral-banner hidden"></div>

    <div class="input-card">
      <h1 class="input-title">✨ 查詢今日運勢</h1>

      <label class="input-label" for="name-input">你的名字或暱稱</label>
      <input type="text" id="name-input" class="name-input"
             placeholder="例如：漂亮媽咪、幽默阿賢、午餐吃炒飯" maxlength="10" autocomplete="off">

      <div class="zodiac-section-label">選擇你的星座</div>
      <div class="zodiac-grid" id="zodiac-grid"></div>

      <button id="submit-btn" class="submit-btn" disabled>看我的運勢 →</button>
    </div>

    <div class="footer-links">
      <a href="https://aiwellnesstw.github.io" target="_blank">✨ 給自己好氣色</a>
      <a href="https://www.facebook.com/profile.php?id=61590570201197" target="_blank">📘 AI工作室FB</a>
      <a href="https://www.instagram.com/ai.wellness.tw/" target="_blank">📸 AI工作室IG</a>
    </div>
  </div>

  <!-- ── 畫面二：結果 ── -->
  <div id="screen-result" class="screen">
    <div class="result-header">
      <button id="back-btn" class="back-btn">← 重新查詢</button>
      <div class="result-brand">✨ 今日星座運勢</div>
    </div>

    <div class="result-card">
      <div id="result-title" class="result-title"></div>
      <div id="result-zodiac-badge" class="result-zodiac-badge"></div>

      <div class="energy-section">
        <div id="energy-number" class="energy-number">0</div>
        <div class="energy-unit">分</div>
        <div id="energy-label" class="energy-label"></div>
      </div>

      <div class="lucky-section">
        <div class="lucky-item">
          <div id="lucky-color-swatch" class="lucky-color-swatch"></div>
          <div>
            <div class="lucky-item-label">幸運色</div>
            <div id="lucky-color-name" class="lucky-item-value"></div>
          </div>
        </div>
        <div class="lucky-divider"></div>
        <div class="lucky-item">
          <div class="lucky-number-icon">🎯</div>
          <div>
            <div class="lucky-item-label">幸運數字</div>
            <div id="lucky-number" class="lucky-item-value"></div>
          </div>
        </div>
      </div>

      <div id="fortune-text" class="fortune-text"></div>

      <div class="cta-section">
        <div id="cta-text" class="cta-text"></div>
        <div class="product-carousel-wrap">
          <div class="product-carousel">
            <a class="product-card" href="https://aiwellnesstw.github.io" target="_blank">
              <img src="https://cdn1-next.cybassets.com/media/W1siZiIsIjE2NjAwL3Byb2R1Y3RzLzY0ODM4MDYyLzE3Njg4ODE1NzFfNTI4YTU3MjcyOGI2M2I4NzFjYjguanBlZyJdLFsicCIsInRodW1iIiwiNjAweDYwMCJdXQ.jpeg?sha=8fca16c5cdd9d459" class="product-card-img" alt="吉燕窩" loading="lazy">
              <div class="product-card-name">吉燕窩</div>
            </a>
            <a class="product-card" href="https://aiwellnesstw.github.io" target="_blank">
              <img src="https://cdn1-next.cybassets.com/media/W1siZiIsIjE2NjAwL3Byb2R1Y3RzLzU1MjQ1NzU5LzE3NDY1OTI4MzVfMTUwNDk0NmNmZmFmYzRjODYxNjcucG5nIl0sWyJwIiwidGh1bWIiLCI2MDB4NjAwIl1d.png?sha=79c67a503c74e785" class="product-card-img" alt="魚子松露保養三件組" loading="lazy">
              <div class="product-card-name">魚子松露保養三件組</div>
            </a>
            <a class="product-card" href="https://aiwellnesstw.github.io" target="_blank">
              <img src="https://cdn1-next.cybassets.com/media/W1siZiIsIjE2NjAwL3Byb2R1Y3RzLzU1MjQ1NzQyLzE3NjI1MDQ3MjdfYzY5MjFiNDBkMzlhMGQ3N2ZiMDguanBlZyJdLFsicCIsInRodW1iIiwiNjAweDYwMCJdXQ.jpeg?sha=c2339161b3794b5b" class="product-card-img" alt="魚子松露活顏噴霧" loading="lazy">
              <div class="product-card-name">魚子松露活顏噴霧</div>
            </a>
            <a class="product-card" href="https://aiwellnesstw.github.io" target="_blank">
              <img src="https://cdn1-next.cybassets.com/media/W1siZiIsIjE2NjAwL3Byb2R1Y3RzLzY1MTY1NDQ0LzE3Njk2NjUwMTZfMzI4MDNlYTZlNmQ4ZmE1MTVjZGIucG5nIl0sWyJwIiwidGh1bWIiLCI2MDB4NjAwIl1d.png?sha=5e72aa162270cc1a" class="product-card-img" alt="清潤養氣御守粉包" loading="lazy">
              <div class="product-card-name">清潤養氣御守粉包</div>
            </a>
            <a class="product-card" href="https://aiwellnesstw.github.io" target="_blank">
              <img src="https://cdn1-next.cybassets.com/media/W1siZiIsIjE2NjAwL3Byb2R1Y3RzLzY0ODM3ODk5LzE3Njg4ODE4NjBfOTc3YmIxYjE2NmE0NWRhMDg1N2MuanBlZyJdLFsicCIsInRodW1iIiwiNjAweDYwMCJdXQ.jpeg?sha=adf8d97307164d3a" class="product-card-img" alt="維生素B群膠囊" loading="lazy">
              <div class="product-card-name">維生素B群膠囊</div>
            </a>
            <a class="product-card" href="https://aiwellnesstw.github.io" target="_blank">
              <img src="https://cdn1-next.cybassets.com/media/W1siZiIsIjE2NjAwL3Byb2R1Y3RzLzY0ODM3ODI0LzE3Njg4ODE5NDNfYmQ1NjI0MjRmNWQ0ZWQyMmY4ZjIuanBlZyJdLFsicCIsInRodW1iIiwiNjAweDYwMCJdXQ.jpeg?sha=f0edef0c1383c155" class="product-card-img" alt="複方維生素C膠囊" loading="lazy">
              <div class="product-card-name">複方維生素C膠囊</div>
            </a>
          </div>
        </div>
        <div class="carousel-hint">← 滑動看更多好物 →</div>
      </div>

      <div class="memo-wrap">
        <input type="text" id="memo-input" class="memo-input"
               placeholder="📝 備忘錄（選填）例：6/6放假不用到公司" maxlength="30" autocomplete="off">
      </div>

      <button id="save-btn" class="save-btn">🖼 儲存早安圖</button>
      <button id="share-btn" class="share-btn">📲 分享給家人</button>
    </div>

    <div class="footer-links">
      <a href="https://aiwellnesstw.github.io" target="_blank">✨ 給自己好氣色</a>
      <a href="https://www.facebook.com/profile.php?id=61590570201197" target="_blank">📘 AI工作室FB</a>
      <a href="https://www.instagram.com/ai.wellness.tw/" target="_blank">📸 AI工作室IG</a>
    </div>
  </div>

</div>
<!-- 圖卡預覽 overlay（iOS 長按儲存用） -->
<div id="img-overlay" class="img-overlay hidden">
  <div class="img-overlay-bg"></div>
  <div class="img-overlay-inner">
    <p class="img-hint">📱 長按圖片儲存到相簿</p>
    <img id="preview-img" src="" alt="今日運勢圖卡" class="preview-img">
    <button id="close-overlay" class="close-overlay-btn">✕ 關閉</button>
  </div>
</div>

<script src="fortune-pool.js"></script>
<script src="app.js"></script>
</body>
</html>
